components:
  schemas:
    AuthFailed:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    CSRFResponse:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    CategoryEnum:
      enum:
      - SHAPED_DENSE
      - INSULATING_FIREBRICK
      - UNSHAPED_CASTABLE
      - CARBON_MICROPOROUS
      - SILICA_CHECKERS
      type: string
      description: |-
        * `SHAPED_DENSE` - Dense Shaped Refractory Bricks
        * `INSULATING_FIREBRICK` - Insulating Firebricks (IFB)
        * `UNSHAPED_CASTABLE` - Unshaped Monolithics & Castables
        * `CARBON_MICROPOROUS` - Carbon & Microporous Blocks
        * `SILICA_CHECKERS` - Silica / Andalusite Stove Checkers
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        industry_segment:
          type: string
          maxLength: 100
        contact_person:
          type: string
          maxLength: 150
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - country
      - created_at
      - id
      - name
    CodeEnum:
      enum:
      - AP
      - BD
      - CCS
      - PLC
      - TC
      - CREEP
      - RUL
      - CHEMICAL_ANALYSIS
      - GRAIN_SIZE
      - FLOW
      - ABRASION
      - MOR
      - REVERSIBLE_THERMAL_EXP
      type: string
      description: |-
        * `AP` - Apparent Porosity (AP)
        * `BD` - Bulk Density (BD)
        * `CCS` - Cold Crushing Strength (CCS)
        * `PLC` - Permanent Linear Change (PLC)
        * `TC` - Thermal Conductivity (TC)
        * `CREEP` - Creep in Compression
        * `RUL` - Refractoriness Under Load (RUL)
        * `CHEMICAL_ANALYSIS` - Chemical Analysis (WD-XRF)
        * `GRAIN_SIZE` - Grain Size Distribution
        * `FLOW` - Flowability of Monolithics
        * `ABRASION` - Abrasion Resistance
        * `MOR` - Modulus of Rupture (Cold / Hot)
        * `REVERSIBLE_THERMAL_EXP` - Reversible Thermal Expansion
    ConsolidatedReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        crc_number:
          type: string
          description: e.g. DC-CRC-2026-BF6-01
          maxLength: 60
        project:
          type: string
          format: uuid
        project_code:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/Status6c4Enum'
        samples:
          type: array
          items:
            type: string
            format: uuid
        report_snapshot_json: {}
        sha256_hash:
          type: string
          maxLength: 64
        approved_by:
          type: string
          format: uuid
        approved_by_name:
          type: string
          readOnly: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_by
      - approved_by_name
      - crc_number
      - created_at
      - id
      - project
      - project_code
      - samples
    Deviation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        qa_review:
          type: string
          format: uuid
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        deviation_description:
          type: string
        technical_justification:
          type: string
          description: Mandatory engineering rationale explaining why deviation is
            acceptable or rejected.
        is_acceptable:
          type: boolean
        justified_by:
          type: string
          format: uuid
          readOnly: true
        justified_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - deviation_description
      - id
      - justified_by
      - justified_by_name
      - qa_review
      - technical_justification
    DeviationRequest:
      type: object
      properties:
        qa_review:
          type: string
          format: uuid
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        deviation_description:
          type: string
          minLength: 1
        technical_justification:
          type: string
          minLength: 1
          description: Mandatory engineering rationale explaining why deviation is
            acceptable or rejected.
        is_acceptable:
          type: boolean
      required:
      - deviation_description
      - qa_review
      - technical_justification
    DisciplineEnum:
      enum:
      - PHYSICAL
      - MECHANICAL
      - THERMAL
      - CHEMICAL
      type: string
      description: |-
        * `PHYSICAL` - Physical
        * `MECHANICAL` - Mechanical
        * `THERMAL` - Thermal
        * `CHEMICAL` - Chemical
    EvaluationStatusEnum:
      enum:
      - PASS
      - DEVIATION
      - FAIL
      - INDETERMINATE
      - NEEDS_REVIEW
      - MISSING_DATA
      type: string
      description: |-
        * `PASS` - Meets Specification
        * `DEVIATION` - Technical Deviation
        * `FAIL` - Specification Failed
        * `INDETERMINATE` - Indeterminate (Qualified Value Ambiguity)
        * `NEEDS_REVIEW` - Needs Senior Metallurgist Review
        * `MISSING_DATA` - Missing Data
    FinalDecision:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sample:
          type: string
          format: uuid
        sample_code:
          type: string
          readOnly: true
        specification_set:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        approver:
          type: string
          format: uuid
          readOnly: true
        approver_name:
          type: string
          readOnly: true
        decision_notes:
          type: string
          description: Engineering summary & release justification.
        decided_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approver
      - approver_name
      - decided_at
      - decision_notes
      - id
      - outcome
      - sample
      - sample_code
      - specification_set
