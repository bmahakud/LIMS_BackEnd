openapi: 3.0.3
info:
  title: Danieli Corus Refractory Laboratory LIMS API
  version: 1.0.0
  description: REST API backend for Danieli Corus Procedure R-01 Refractory Acceptance
    & Testing Laboratory.
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the csrftoken cookie on the client and returns the token in
        the JSON body.
      summary: Retrieve CSRF Token
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates credentials and establishes a secure HttpOnly session.
      summary: User Session Login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFailed'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InactiveUser'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Clears the server-side session and cookies.
      summary: User Logout
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
